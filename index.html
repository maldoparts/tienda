<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MaldoParts — Autopartes y Competición</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1E1E1E;
      --bg-card-hover: #262626;
      --primary-red: #E50914;
      --primary-red-hover: #B80710;
      --text-white: #FFFFFF;
      --text-gray: #A0A0A0;
      --border-color: #2A2A2A;
      --font-title: 'Teko', sans-serif;
      --font-body: 'Roboto', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      line-height: 1.5;
      touch-action: manipulation;
    }

    header {
      background-color: #0A0A0A;
      border-bottom: 2px solid var(--primary-red);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      background: #1A1A1A;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: white;
      outline: none;
      font-size: 16px;
    }

    .search-box input:focus {
      border-color: var(--primary-red);
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-gray);
    }

    .cart-header-btn {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--primary-red);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-badge {
      background: var(--primary-red);
      color: white;
      border-radius: 50%;
      padding: 0.1rem 0.5rem;
      font-size: 0.8rem;
    }

    .hero {
      background-color: #000000;
      padding: 0;
      width: 100%;
      text-align: center;
      border-bottom: 2px solid var(--primary-red);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-logo {
      width: 100%;
      max-width: 1200px;
      height: auto;
      max-height: 500px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .categories-nav {
      display: flex;
      justify-content: flex-start;
      gap: 0.8rem;
      padding: 1rem 1.5rem;
      background: #0D0D0D;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid var(--border-color);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .categories-nav::-webkit-scrollbar { display: none; }
    .categories-nav { -ms-overflow-style: none; scrollbar-width: none; }

    .cat-btn {
      background: var(--bg-card);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 0.7rem 1.3rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .cat-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      vertical-align: middle;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary-red);
      border-color: var(--primary-red);
    }

    .catalog-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .category-title {
      font-family: var(--font-title);
      font-size: 2.5rem;
      letter-spacing: 1px;
      border-left: 4px solid var(--primary-red);
      padding-left: 1rem;
      margin: 2rem 0 1rem;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .title-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      vertical-align: middle;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-red);
      background: var(--bg-card-hover);
    }

    .product-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #FFFFFF;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .product-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image-wrapper img {
      transform: scale(1.04);
    }

    .product-badge-car {
      background: #0A0A0A;
      color: var(--primary-red);
      border: 1px solid var(--primary-red);
      font-size: 0.8rem;
      font-weight: bold;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-info h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .product-specs {
      font-size: 0.8rem;
      color: var(--text-gray);
      margin-bottom: 0.8rem;
      line-height: 1.3;
      background: #141414;
      padding: 0.5rem;
      border-radius: 6px;
      border-left: 2px solid var(--primary-red);
    }

    .option-select-group {
      margin-bottom: 1rem;
    }

    .option-select-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-gray);
      margin-bottom: 0.3rem;
    }

    .option-select {
      width: 100%;
      padding: 0.6rem;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .option-select:focus {
      border-color: var(--primary-red);
    }

    .product-price {
      color: var(--primary-red);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .quantity-controls button {
      background: transparent;
      color: white;
      border: none;
      width: 30px;
      height: 35px;
      cursor: pointer;
      font-size: 1rem;
    }

    .quantity-controls span {
      width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .btn-add {
      flex: 1;
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: var(--primary-red-hover);
    }

    .btn-consult-wa {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      transition: background 0.2s;
      text-decoration: none;
    }

    .btn-consult-wa:hover {
      background: #1ebc57;
    }

    .cart-float-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0A0A0A;
      border: 2px solid var(--primary-red);
      border-radius: 15px;
      padding: 0.8rem 1.2rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 1.2rem;
      z-index: 99;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-count {
      font-size: 0.85rem;
      color: var(--text-gray);
    }

    .cart-total {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .btn-open-cart {
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-sidebar-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 200;
    }

    .cart-sidebar {
      position: fixed;
      top: 0; right: -400px; width: 100%; max-width: 380px; height: 100%;
      background: #161616;
      border-left: 2px solid var(--primary-red);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
      box-shadow: -5px 0 25px rgba(0,0,0,0.9);
    }

    .cart-sidebar.open {
      right: 0;
    }

    .cart-sidebar-header {
      padding: 1.2rem;
      background: #0A0A0A;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-sidebar-header h2 {
      font-family: var(--font-title);
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .close-cart-btn {
      background: transparent;
      border: none;
      color: var(--text-gray);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-sidebar-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.8rem;
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .cart-item-img {
      width: 50px;
      height: 50px;
      border-radius: 6px;
      object-fit: cover;
      background: #fff;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    .cart-item-price {
      color: var(--primary-red);
      font-weight: bold;
      font-size: 0.95rem;
    }

    .cart-sidebar-footer {
      padding: 1.2rem;
      background: #0A0A0A;
      border-top: 1px solid var(--border-color);
    }

    .cart-sidebar-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .btn-checkout-wa {
      width: 100%;
      background: #25D366;
      color: white;
      border: none;
      padding: 0.9rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      font-size: 1rem;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--primary-red);
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
    }

    .modal-content h2 {
      font-family: var(--font-title);
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-family: var(--font-body);
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-cancel {
      flex: 1;
      background: #333;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-send {
      flex: 2;
      background: #25D366;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      background: #050505;
      border-top: 1px solid var(--border-color);
      padding: 2rem;
      text-align: center;
      margin-top: 4rem;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      header { padding: 0.8rem 1rem; }
      .search-box { flex: 1; width: auto; }
      .hero-logo { max-height: 280px; }
      .cart-float-bar { width: 90%; left: 5%; right: 5%; justify-content: space-between; }
      .categories-nav { justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-actions">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar autoparte o auto..." onkeyup="filterProducts()">
      </div>
      <button class="cart-header-btn" onclick="openCartSidebar()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-badge" id="headerCartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <img src="foto.png" alt="MaldoParts Banner" class="hero-logo">
  </section>

  <nav class="categories-nav">
    <button class="cat-btn active" onclick="filterCategory('all', event)"><i class="fa-solid fa-border-all"></i> Todos</button>
    <button class="cat-btn" onclick="filterCategory('volantes', event)">
      <img src="icon-volante.png" alt="Volantes" class="cat-icon" onerror="this.style.display='none'"> Volantes
    </button>
    <button class="cat-btn" onclick="filterCategory('masas', event)">
      <img src="icon-masa.png" alt="Masas" class="cat-icon" onerror="this.style.display='none'"> Masas
    </button>
    <button class="cat-btn" onclick="filterCategory('luces', event)">
      <img src="icon-luces.png" alt="Luces" class="cat-icon" onerror="this.style.display='none'"> Luces
    </button>
    <button class="cat-btn" onclick="filterCategory('amortiguadores', event)">
      <img src="icon-amortiguador.png" alt="Amortiguadores" class="cat-icon" onerror="this.style.display='none'"> Amortiguadores de Capot
    </button>
    <button class="cat-btn" onclick="filterCategory('frenos', event)">
      <img src="icon-frenos.png" alt="Frenos" class="cat-icon" onerror="this.style.display='none'"> Frenos
    </button>
    <button class="cat-btn" onclick="filterCategory('otros', event)">
      <img src="icon-otros.png" alt="Otros" class="cat-icon" onerror="this.style.display='none'"> Otros
    </button>
  </nav>

  <main class="catalog-container" id="catalog"></main>

  <div class="cart-float-bar" id="cartBar" style="display: none;">
    <div class="cart-info">
      <span class="cart-count" id="cartCount">0 productos seleccionados</span>
      <span class="cart-total" id="cartTotal">$0</span>
    </div>
    <button class="btn-open-cart" onclick="openCartSidebar()">
      <i class="fa-solid fa-cart-shopping"></i> Ver Carrito
    </button>
  </div>

  <div class="cart-sidebar-backdrop" id="cartBackdrop" onclick="closeCartSidebar()"></div>
  <div class="cart-sidebar" id="cartSidebar">
    <div class="cart-sidebar-header">
      <h2>MI CARRITO</h2>
      <button class="close-cart-btn" onclick="closeCartSidebar()">&times;</button>
    </div>
    <div class="cart-sidebar-items" id="cartSidebarItems"></div>
    <div class="cart-sidebar-footer">
      <div class="cart-sidebar-total">
        <span>TOTAL:</span>
        <span id="sidebarTotal">$0</span>
      </div>
      <button class="btn-checkout-wa" onclick="openOrderModal()">
        <i class="fa-brands fa-whatsapp fa-lg"></i> Finalizar por WhatsApp
      </button>
    </div>
  </div>

  <div class="modal-backdrop" id="orderModal">
    <div class="modal-content">
      <h2>CONFIRMAR PEDIDO</h2>
      <p style="color: var(--text-gray); margin-bottom: 1rem; font-size: 0.9rem;">
        Completá tus datos para adjuntarlos al mensaje automático de WhatsApp:
      </p>
      <div class="form-group">
        <label>Nombre y Apellido</label>
        <input type="text" id="custName" placeholder="Ej: Juan Pérez">
      </div>
      <div class="form-group">
        <label>Ubicación / Ciudad</label>
        <input type="text" id="custCity" placeholder="Ej: Buenos Aires">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeOrderModal()">Cancelar</button>
        <button class="btn-send" onclick="sendWhatsAppOrder()">
          <i class="fa-brands fa-whatsapp"></i> Mandar a WhatsApp
        </button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 <strong>MaldoParts</strong>. Todos los derechos reservados.</p>
    <p>Especialistas en autopartes, accesorios y equipamiento automotriz.</p>
  </footer>

    let cart = {};
    let selectedOptions = {};
    let currentCategory = 'all';

    function renderCatalog() {
      const catalogEl = document.getElementById('catalog');
      catalogEl.innerHTML = '';

      const categories = [
        { id: 'volantes', title: '<img src="icon-volante.png" class="title-icon" onerror="this.style.display=\'none\'"> Volantes' },
        { id: 'masas', title: '<img src="icon-masa.png" class="title-icon" onerror="this.style.display=\'none\'"> Masas' },
        { id: 'luces', title: '<img src="icon-luces.png" class="title-icon" onerror="this.style.display=\'none\'"> Luces' },
        { id: 'amortiguadores', title: '<img src="icon-amortiguador.png" class="title-icon" onerror="this.style.display=\'none\'"> Amortiguadores de Capot' },
        { id: 'frenos', title: '<img src="icon-frenos.png" class="title-icon" onerror="this.style.display=\'none\'"> Frenos' },
        { id: 'otros', title: '<img src="icon-otros.png" class="title-icon" onerror="this.style.display=\'none\'"> Otros' }
      ];

      categories.forEach(cat => {
        if (currentCategory !== 'all' && currentCategory !== cat.id) return;

        const filteredProds = productsData.filter(p => p.category === cat.id);

        if (filteredProds.length > 0) {
          const catHeader = document.createElement('h2');
          catHeader.className = 'category-title';
          catHeader.innerHTML = cat.title;
          catalogEl.appendChild(catHeader);

          const grid = document.createElement('div');
          grid.className = 'products-grid';

          filteredProds.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'product-card';

            let imageHtml = '';
            if (prod.image) {
              imageHtml = `
                <div class="product-image-wrapper">
                  <img src="${prod.image}" alt="${prod.name}" onerror="handleImageError(this)">
                </div>
              `;
            }

            let carBadgeHtml = prod.carModel ? `<span class="product-badge-car">${prod.carModel}</span>` : '';
            let specsHtml = prod.specs ? `<div class="product-specs">${prod.specs}</div>` : '';

            if (prod.options) {
              if (selectedOptions[prod.id] === undefined) {
                selectedOptions[prod.id] = 0;
              }
              const currentOptIndex = selectedOptions[prod.id];
              const currentOpt = prod.options[currentOptIndex];
              const cartKey = `${prod.id}_${currentOptIndex}`;
              const qty = cart[cartKey] ? cart[cartKey].qty : 0;

              let selectOptionsHtml = prod.options.map((opt, idx) => 
                `<option value="${idx}" ${idx === currentOptIndex ? 'selected' : ''}>${opt.name}</option>`
              ).join('');

              card.innerHTML = `
                ${imageHtml}
                <div>
                  ${carBadgeHtml}
                  <h3>${prod.name}</h3>
                  ${specsHtml}
                  <div class="option-select-group">
                    <label>Elegí la opción:</label>
                    <select class="option-select" onchange="updateProductOption(${prod.id}, this.value)">
                      ${selectOptionsHtml}
                    </select>
                  </div>
                  <div class="product-price" id="price-${prod.id}">$${currentOpt.price.toLocaleString('es-AR')}</div>
                </div>
                <div class="card-actions">
                  <div class="quantity-controls">
                    <button onclick="changeQtyWithOptions(${prod.id}, -1)">-</button>
                    <span id="qty-${prod.id}">${qty}</span>
                    <button onclick="changeQtyWithOptions(${prod.id}, 1)">+</button>
                  </div>
                  <button class="btn-add" onclick="changeQtyWithOptions(${prod.id}, 1)">
                    ${qty > 0 ? 'Añadido' : 'Agregar'}
                  </button>
                </div>
              `;
            } else if (prod.isConsult) {
              const directWaUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('¡Hola MaldoParts! 👋 Quisiera consultar por otros modelos de lámparas LED.')}`;
              card.innerHTML = `
                ${imageHtml}
                <div class="product-info">
                  <h3>${prod.name}</h3>
                </div>
                <a href="${directWaUrl}" target="_blank" class="btn-consult-wa">
                  <i class="fa-brands fa-whatsapp"></i> Consultar por WhatsApp
                </a>
              `;
            } else {
              const qty = cart[prod.id] ? (typeof cart[prod.id] === 'object' ? cart[prod.id].qty : cart[prod.id]) : 0;
              card.innerHTML = `
                ${imageHtml}
                <div>
                  ${carBadgeHtml}
                  <div class="product-info">
                    <h3>${prod.name}</h3>
                    ${specsHtml}
                    <div class="product-price">$${prod.price.toLocaleString('es-AR')}</div>
                  </div>
                </div>
                <div class="card-actions">
                  <div class="quantity-controls">
                    <button onclick="changeQtySimple(${prod.id}, -1)">-</button>
                    <span id="qty-${prod.id}">${qty}</span>
                    <button onclick="changeQtySimple(${prod.id}, 1)">+</button>
                  </div>
                  <button class="btn-add" onclick="changeQtySimple(${prod.id}, 1)">
                    ${qty > 0 ? 'Añadido' : 'Agregar'}
                  </button>
                </div>
              `;
            }
            grid.appendChild(card);
          });

          catalogEl.appendChild(grid);
        }
      });
    }

    function updateProductOption(productId, optionIndex) {
      selectedOptions[productId] = parseInt(optionIndex);
      const prod = productsData.find(p => p.id === productId);
      if (prod && prod.options) {
        const currentOpt = prod.options[selectedOptions[productId]];
        const priceEl = document.getElementById(`price-${productId}`);
        if (priceEl) {
          priceEl.innerText = `$${currentOpt.price.toLocaleString('es-AR')}`;
        }
        const cartKey = `${productId}_${selectedOptions[productId]}`;
        const qty = cart[cartKey] ? cart[cartKey].qty : 0;
        const qtySpan = document.getElementById(`qty-${productId}`);
        if (qtySpan) {
          qtySpan.innerText = qty;
        }
      }
    }

    function changeQtyWithOptions(productId, change) {
      const optIndex = selectedOptions[productId] || 0;
      const cartKey = `${productId}_${optIndex}`;
      const prod = productsData.find(p => p.id === productId);

      if (!prod || !prod.options) return;
      const opt = prod.options[optIndex];

      const currentQty = cart[cartKey] ? cart[cartKey].qty : 0;
      const newQty = Math.max(0, currentQty + change);

      if (newQty === 0) {
        delete cart[cartKey];
      } else {
        cart[cartKey] = {
          id: productId,
          name: `${prod.name} [${opt.name}]`,
          price: opt.price,
          qty: newQty,
          image: prod.image || ''
        };
      }

      const qtySpan = document.getElementById(`qty-${productId}`);
      if (qtySpan) qtySpan.innerText = newQty;

      updateCartUI();
    }

    function changeQtySimple(productId, change) {
      const prod = productsData.find(p => p.id === productId);
      if (!prod) return;

      const currentQty = cart[productId] ? (typeof cart[productId] === 'object' ? cart[productId].qty : cart[productId]) : 0;
      const newQty = Math.max(0, currentQty + change);

      if (newQty === 0) {
        delete cart[productId];
      } else {
        cart[productId] = {
          id: productId,
          name: prod.name,
          price: prod.price,
          qty: newQty,
          image: prod.image || ''
        };
      }

      const qtySpan = document.getElementById(`qty-${productId}`);
      if (qtySpan) qtySpan.innerText = newQty;

      updateCartUI();
    }

    function handleImageError(imgElement) {
      const container = imgElement.parentElement;
      if (container) {
        container.remove();
      }
    }

    function updateCartUI() {
      let totalItems = 0;
      let totalPrice = 0;
      const cartItemsContainer = document.getElementById('cartSidebarItems');
      cartItemsContainer.innerHTML = '';

      for (const [key, item] of Object.entries(cart)) {
        if (typeof item === 'object') {
          totalItems += item.qty;
          const subtotal = item.price * item.qty;
          totalPrice += subtotal;

          const cartItem = document.createElement('div');
          cartItem.className = 'cart-item';
          
          let itemImgHtml = item.image ? `<img src="${item.image}" class="cart-item-img" onerror="this.style.display='none'">` : '';

          cartItem.innerHTML = `
            ${itemImgHtml}
            <div class="cart-item-details">
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-price">$${item.price.toLocaleString('es-AR')} x ${item.qty} = $${subtotal.toLocaleString('es-AR')}</div>
            </div>
          `;
          cartItemsContainer.appendChild(cartItem);
        }
      }

      document.getElementById('headerCartCount').innerText = totalItems;
      document.getElementById('cartCount').innerText = `${totalItems} producto${totalItems > 1 ? 's' : ''}`;
      document.getElementById('cartTotal').innerText = `$${totalPrice.toLocaleString('es-AR')}`;
      document.getElementById('sidebarTotal').innerText = `$${totalPrice.toLocaleString('es-AR')}`;

      const cartBar = document.getElementById('cartBar');
      if (totalItems > 0) {
        cartBar.style.display = 'flex';
      } else {
        cartBar.style.display = 'none';
        closeCartSidebar();
      }
    }

    function openCartSidebar() {
      if (Object.keys(cart).length === 0) {
        alert("Tu carrito está vacío. Agregá algún producto para verlo.");
        return;
      }
      document.getElementById('cartSidebar').classList.add('open');
      document.getElementById('cartBackdrop').style.display = 'block';
    }

    function closeCartSidebar() {
      document.getElementById('cartSidebar').classList.remove('open');
      document.getElementById('cartBackdrop').style.display = 'none';
    }

    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      }
      renderCatalog();
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.product-card');

      if (!query) {
        cards.forEach(card => card.style.display = 'flex');
        return;
      }

      productsData.forEach(prod => {
        const nameMatch = prod.name ? prod.name.toLowerCase().includes(query) : false;
        const carModelMatch = prod.carModel ? prod.carModel.toLowerCase().includes(query) : false;
        const categoryMatch = prod.category ? prod.category.toLowerCase().includes(query) : false;

        const cardEl = Array.from(cards).find(card => {
          const titleEl = card.querySelector('h3');
          return titleEl && titleEl.innerText.toLowerCase().includes(prod.name.toLowerCase());
        });

        if (cardEl) {
          if (nameMatch || carModelMatch || categoryMatch) {
            cardEl.style.display = 'flex';
          } else {
            cardEl.style.display = 'none';
          }
        }
      });
    }

    function openOrderModal() {
      if (Object.keys(cart).length === 0) {
        alert("Tu carrito está vacío.");
        return;
      }
      closeCartSidebar();
      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById('custName').value.trim();
      const city = document.getElementById('custCity').value.trim();

      if (!name) {
        alert("Por favor ingresá tu nombre para continuar.");
        return;
      }

      let orderDetails = "";
      let totalPrice = 0;

      for (const [key, item] of Object.entries(cart)) {
        if (typeof item === 'object') {
          const itemTotal = item.price * item.qty;
          totalPrice += itemTotal;
          orderDetails += `• ${item.qty}x ${item.name} — $${itemTotal.toLocaleString('es-AR')}\n`;
        }
      }

      let message = `¡Hola *MaldoParts*! 👋 Quisiera realizar la siguiente compra:\n\n`;
      message += `🛒 *DETALLE DEL PEDIDO:*\n${orderDetails}\n`;
      message += `💰 *TOTAL ESTIMADO:* $${totalPrice.toLocaleString('es-AR')}\n\n`;
      message += `👤 *DATOS DEL CLIENTE:*\n`;
      message += `- *Nombre:* ${name}\n`;
      if (city) message += `- *Ubicación:* ${city}\n`;
      message += `\nQuedo a la espera para coordinar el pago y envío. ¡Muchas gracias!`;

      const encodedMessage = encodeURIComponent(message);
      const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

      window.open(whatsappUrl, '_blank');
      closeOrderModal();
    }

    renderCatalog();
  </script>
</body>
</html>
