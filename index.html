<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaldoParts — Autopartes y Competición</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #121212;
      --bg-card: #1E1E1E;
      --bg-card-hover: #262626;
      --primary-red: #E50914;
      --primary-red-hover: #B80710;
      --text-white: #FFFFFF;
      --text-gray: #A0A0A0;
      --border-color: #2A2A2A;
      --font-title: 'Teko', sans-serif;
      --font-body: 'Roboto', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    /* HEADER */
    header {
      background-color: #0A0A0A;
      border-bottom: 2px solid var(--primary-red);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-logo {
      height: 50px;
      width: auto;
      object-fit: contain;
    }

    .brand-name {
      font-family: var(--font-title);
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--text-white);
      text-transform: uppercase;
    }

    .brand-name span {
      color: var(--primary-red);
    }

    .search-box {
      position: relative;
      width: 300px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      background: #1A1A1A;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: white;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary-red);
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-gray);
    }

    /* HERO BANNER */
    .hero {
      background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)),
                  url('https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=1350&q=80') center/cover;
      padding: 3rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .hero h1 {
      font-family: var(--font-title);
      font-size: 3.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero p {
      color: var(--text-gray);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0.5rem auto 0;
    }

    /* CATEGORIES NAV */
    .categories-nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      background: #0D0D0D;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }

    .cat-btn {
      background: var(--bg-card);
      color: var(--text-white);
      border: 1px solid var(--border-color);
      padding: 0.7rem 1.5rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary-red);
      border-color: var(--primary-red);
    }

    /* MAIN CATALOG CONTAINER */
    .catalog-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .category-title {
      font-family: var(--font-title);
      font-size: 2.5rem;
      letter-spacing: 1px;
      border-left: 4px solid var(--primary-red);
      padding-left: 1rem;
      margin: 2rem 0 1rem;
      text-transform: uppercase;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* PRODUCT CARD & 1280x1280 IMAGES */
    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-red);
      background: var(--bg-card-hover);
    }

    /* MARCO CUADRADO 1:1 APTO PARA 1280x1280 */
    .product-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #FFFFFF;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .product-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image-wrapper img {
      transform: scale(1.04);
    }

    .product-info h3 {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      min-height: 2.6rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      color: var(--primary-red);
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .quantity-controls button {
      background: transparent;
      color: white;
      border: none;
      width: 30px;
      height: 35px;
      cursor: pointer;
      font-size: 1rem;
    }

    .quantity-controls span {
      width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .btn-add {
      flex: 1;
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: var(--primary-red-hover);
    }

    /* FLOATING CART BAR */
    .cart-float-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0A0A0A;
      border: 2px solid var(--primary-red);
      border-radius: 15px;
      padding: 1rem 1.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 1.5rem;
      z-index: 99;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-count {
      font-size: 0.9rem;
      color: var(--text-gray);
    }

    .cart-total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .btn-checkout {
      background: #25D366;
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }

    .btn-checkout:hover {
      opacity: 0.9;
    }

    /* MODAL ORDER FORM */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--primary-red);
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
    }

    .modal-content h2 {
      font-family: var(--font-title);
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem;
      background: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-cancel {
      flex: 1;
      background: #333;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-send {
      flex: 2;
      background: #25D366;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* FOOTER */
    footer {
      background: #050505;
      border-top: 1px solid var(--border-color);
      padding: 2rem;
      text-align: center;
      margin-top: 4rem;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
      }
      .search-box {
        width: 100%;
      }
      .hero h1 {
        font-size: 2.5rem;
      }
      .cart-float-bar {
        width: 90%;
        left: 5%;
        right: 5%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-container">
      <img src="foto.png" alt="MaldoParts Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-name">MALDO<span>PARTS</span></div>
    </div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Buscar autoparte..." on¡Claramente! Podés modificar la lógica para que valide la existencia de la imagen antes de renderizarla. Si no hay imagen disponible, simplemente salta esa parte y no dibuja ningún texto ni contenedor.

Dependiendo de cómo estés armando tu código, podés implementarlo así:

**Opción 1: Renderizado condicional (React / JSX)**
Usá el operador `&&` para que el elemento solo se cree si existe la URL de la imagen:

```jsx
{producto.imagenUrl && (
  <img src={producto.imagenUrl} alt={producto.nombre} />
)}
